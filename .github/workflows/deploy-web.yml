name: Deploy web app

# Pubblica la versione web su GitHub Pages a ogni modifica di main.
# URL e chiave pubblica di Supabase NON sono nel repository: si impostano in
# Settings → Secrets and variables → Actions → Variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Imposta il percorso del sito
        run: |
          jq '.expo.experiments.baseUrl = "/${{ github.event.repository.name }}"' app.json > app.tmp.json
          mv app.tmp.json app.json
      - name: Export web
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo export --platform web --output-dir dist
      - name: Fallback per i link diretti
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
